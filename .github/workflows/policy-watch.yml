name: Policy Change Archive — daily evidence snapshots

on:
  push:
    branches: [main]
    paths:
      - "monitor.py"
      - "discovery.py"
      - "targets.json"
      - "site/**"
      - "tests/**"
      - "README.md"
      - ".github/workflows/policy-watch.yml"
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Taipei; best effort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-archive-daily
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Capture and commit with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'policy-change-archive[bot]'
          git config user.email 'policy-change-archive[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Never overwrite newer observations if main advanced during a run.
            git fetch origin main
            git checkout -B main origin/main
            git clean -fd data/
            capture_rc=0
            python3 monitor.py || capture_rc=$?
            python3 -m json.tool data/history.json > /dev/null
            python3 -m json.tool data/summary.json > /dev/null
            git add data/
            if git diff --cached --quiet; then
              exit "$capture_rc"
            fi
            git commit -m 'chore: archive daily observations'
            if git push origin HEAD:main; then
              if [ "$capture_rc" -ne 0 ]; then
                echo '::error::All monitored sources failed; error records were saved.'
              fi
              exit "$capture_rc"
            fi
            echo "::warning::main advanced during capture (attempt $attempt); recapturing from latest history."
            sleep 2
          done
          echo '::error::Could not persist observations after three attempts; no history was overwritten.'
          exit 1

  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare static website
        run: |
          mkdir -p public/site public/data
          cp site/index.html public/site/index.html
          cp -r data/. public/data/
          printf '<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./site/"><title>政策變更檔案館</title><a href="./site/">前往監測站</a></html>\n' > public/index.html
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
