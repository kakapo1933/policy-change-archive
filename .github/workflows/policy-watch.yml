name: Policy Change Archive — daily evidence snapshots

# Captures run only on schedule or manual dispatch. A push that changes the public
# page only republishes it; tests for code changes live in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  schedule:
    - cron: "17 1 * * *" # 09:17 Asia/Taipei; best effort
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: policy-archive-daily
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Capture and commit with safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'policy-change-archive[bot]'
          git config user.email 'policy-change-archive[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Never overwrite newer observations if main advanced during a run.
            git fetch origin main
            git checkout -B main origin/main
            git clean -fd data/
            capture_rc=0
            python3 monitor.py || capture_rc=$?
            python3 -m json.tool data/history.json > /dev/null
            python3 -m json.tool data/summary.json > /dev/null
            git add data/
            if git diff --cached --quiet; then
              exit "$capture_rc"
            fi
            git commit -m 'chore: archive daily observations'
            if git push origin HEAD:main; then
              if [ "$capture_rc" -ne 0 ]; then
                echo "::error::Capture exited with code $capture_rc (1 = all sources failed, 2 = fatal error); any saved records were committed."
              fi
              exit "$capture_rc"
            fi
            echo "::warning::main advanced during capture (attempt $attempt); recapturing from latest history."
            sleep 2
          done
          echo '::error::Could not persist observations after three attempts; no history was overwritten.'
          exit 1

  publish:
    needs: capture
    # Skipped capture (site-only push) still publishes; a failed capture does not.
    if: ${{ !cancelled() && (needs.capture.result == 'success' || needs.capture.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Prepare static website
        run: |
          mkdir -p public/site public/data
          cp site/index.html public/site/index.html
          cp -r data/. public/data/
          printf '<!doctype html><html lang="zh-Hant-TW"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./site/"><title>政策變更檔案館</title><a href="./site/">前往監測站</a></html>\n' > public/index.html
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
